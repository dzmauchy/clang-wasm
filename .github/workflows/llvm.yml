name: clang-lld

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version tag (without "llvmorg-" prefix)'
        required: true
        default: '23.1.3'
        type: string

concurrency:
  group: llvm-toolchain-release

jobs:
  wasm32:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-target.yml
    permissions:
      contents: write
    with:
      target: wasm32
      llvm_version: ${{ inputs.llvm_version }}
      tag_name: clang-${{ inputs.llvm_version }}
      verify_commands: |
        npm run test-clang
        npm run test-sysroot
